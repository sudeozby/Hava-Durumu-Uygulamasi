<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu Merkezi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme"> <div id="weather-effects-container"></div>
    
    <header class="py-3 shadow-sm border-bottom glass-header sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0 fw-bold">Hava Durumu Merkezi</h1>
            <button id="theme-toggle-btn" class="btn btn-outline-primary rounded-pill">
                <i class="bi bi-moon-stars-fill"></i> Mod Değiştir
            </button>
        </div>
    </header>

   <main class="container my-5">
        <div class="card p-4 mb-4 shadow-sm glass-card">
            <h2 class="h5 mb-3">Şehir Ara</h2>
            <div class="input-group">
                <input type="text" class="form-control border-0 bg-light" id="city-input" placeholder="Şehir adı girin (Örn: Ankara)...">
               <button class="btn btn-primary px-4" id="get-weather-btn">Göster</button>
            </div> 
        </div> <div id="forecast-result-container" class="mb-4">
            <div class="text-center mb-3">
                <h3 id="forecast-city-name" style="display: inline-block; margin-bottom: 0;"></h3>
                <button id="add-to-fav-btn" class="btn btn-warning btn-sm ms-2 rounded-pill" style="display: none;">
                    ⭐  Favorilere Ekle
                </button>
            </div>
            
            <div id="forecast-cards-container" class="row row-cols-1 row-cols-md-5 g-3 mb-5"></div>

            <div class="card glass-card p-4 border-0 shadow-sm my-4" id="chart-section" style="display:none; border-radius: 20px;">
                <h5 class="fw-bold mb-3"><i class="bi bi-graph-up text-primary me-2"></i>Günlük Sıcaklık Değişimi</h5>
                <div style="height: 300px;">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <h2 class="h4 mb-3">Favori Şehirler</h2>
            <div id="favorite-cities-container" class="row row-cols-1 row-cols-md-4 g-3">
                <p class="text-center w-100">Henüz favori eklenmedi.</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="mb-0 text-muted">&copy; 2026 Hava Durumu Projesi</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
    <div id="notification-toast" class="toast-message"></div>
</body>
</html>
